name: Weirdhost 多账号自动续期

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  add_time:
    name: 续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends xvfb xdotool scrot python3-tk fonts-nanum

      - name: 安装 sing-box
        run: |
          SB_VERSION="1.11.4"
          curl -fsSL -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SB_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "sing-box-${SB_VERSION}-linux-amd64"
          sing-box version

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase aiohttp pynacl

      - name: 运行续期脚本
        env:
          # 邮箱密码兜底（格式：邮箱-----密码 或 备注-----邮箱-----密码）
          WEIRDHOST_ACCOUNT_1: ${{ secrets.WEIRDHOST_ACCOUNT_1 }}
          WEIRDHOST_ACCOUNT_2: ${{ secrets.WEIRDHOST_ACCOUNT_2 }}
          WEIRDHOST_ACCOUNT_3: ${{ secrets.WEIRDHOST_ACCOUNT_3 }}
          WEIRDHOST_ACCOUNT_4: ${{ secrets.WEIRDHOST_ACCOUNT_4 }}
          WEIRDHOST_ACCOUNT_5: ${{ secrets.WEIRDHOST_ACCOUNT_5 }}
          # Cookie 优先（可留空，配合 REPO_TOKEN 登录成功后自动回写）
          WEIRDHOST_COOKIE_1: ${{ secrets.WEIRDHOST_COOKIE_1 }}
          WEIRDHOST_COOKIE_2: ${{ secrets.WEIRDHOST_COOKIE_2 }}
          WEIRDHOST_COOKIE_3: ${{ secrets.WEIRDHOST_COOKIE_3 }}
          WEIRDHOST_COOKIE_4: ${{ secrets.WEIRDHOST_COOKIE_4 }}
          WEIRDHOST_COOKIE_5: ${{ secrets.WEIRDHOST_COOKIE_5 }}
          # 方式 A：一对一绑定节点（优先级高于 PROXY_NODES）
          PROXY_NODE_1: ${{ secrets.PROXY_NODE_1 }}
          PROXY_NODE_2: ${{ secrets.PROXY_NODE_2 }}
          PROXY_NODE_3: ${{ secrets.PROXY_NODE_3 }}
          PROXY_NODE_4: ${{ secrets.PROXY_NODE_4 }}
          PROXY_NODE_5: ${{ secrets.PROXY_NODE_5 }}
          # 方式 B：节点池（每行一个节点链接，按账号顺序自动分配）
          PROXY_NODES: ${{ secrets.PROXY_NODES }}
          # 节点失效时是否回退直连（设为 false 可强制严格隔离）
          PROXY_FALLBACK_DIRECT: "true"
          # 检测到服务器 offline / 수면중 时是否自动开机
          AUTO_START_OFFLINE: "true"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/weirdhost_renew.py

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 3

      - name: 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
